
name: MLOps FastAPI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Train and evaluate ML model
        run: |
          python src/train.py

      - name: Run automated API tests
        run: |
          python -m pytest tests/ -v
        
      - name: Generate model performance charts
        run: |
          python src/visualize.py

      - name: Verify generated charts
        run: |
          test -s results/figures/model_comparison.png
          test -s results/figures/confusion_matrix.png
